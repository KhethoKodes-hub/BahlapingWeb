<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta http-equiv="X-UA-Compatible" content="ie=edge" />
    <link href="assets/images/bahlapingassets/bahlapingLogo.jpeg" rel="icon">

  <title>Bahlaping Mash — Loading</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background-color: #0b2653;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      
      height: 100vh;
      overflow: hidden;
      font-family: 'Segoe UI', sans-serif;
    }

    .loader-brand {
      color: #ffffff;
      font-size: 2.4rem;
      font-weight: 700;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      opacity: 0;
      animation: fadeDown 0.8s ease forwards 0.3s;
      margin-top: 0;
    }

    .loader-brand span { color: #ff5e14; }

    /* Tagline */
    .loader-tagline {
      color: #51668a;
      font-size: 0.78rem;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      opacity: 0;
      animation: fadeDown 0.8s ease forwards 0.6s;
      margin-top: 8px;
    }

    /* Orange accent line */
    .accent-line {
      width: 60px;
      height: 3px;
      background: #ff5e14;
      border-radius: 2px;
      margin-top: 20px;
      opacity: 0;
      animation: fadeIn 0.6s ease forwards 0.7s;
    }

    /* Progress bar */
    .progress-wrap {
      width: 220px;
      height: 3px;
      background: rgba(255,255,255,0.1);
      border-radius: 2px;
      margin-top: 40px;
      overflow: hidden;
      opacity: 0;
      animation: fadeIn 0.4s ease forwards 1.1s;
    }

    .progress-bar {
      height: 100%;
      width: 0%;
      background: linear-gradient(90deg, #ff5e14, #ff8c50);
      border-radius: 2px;
      animation: load 1.8s ease forwards 1.2s;
    }

    /* Keyframes */
    @keyframes fadeDown {
      to { opacity: 1; transform: translateY(0); }
    }
    @keyframes fadeIn {
      to { opacity: 1; }
    }
    @keyframes load {
      0%   { width: 0%; }
      60%  { width: 75%; }
      100% { width: 100%; }
    }

    /* Page fade-out before redirect */
    body.fade-out {
      animation: fadeOut 0.5s ease forwards;
    }
    @keyframes fadeOut {
      to { opacity: 0; }
    }
  </style>
</head>
<body>

  <p class="loader-brand">Bahlaping <span>Mash</span></p>

  <div class="accent-line"></div>
  <p class="loader-tagline">Trading &middot; Mining &middot; Projects</p>

  <div class="progress-wrap">
    <div class="progress-bar"></div>
  </div>

  <script>
    // After progress bar finishes (~3.2s total), fade out then redirect
    setTimeout(function () {
      document.body.classList.add('fade-out');
      setTimeout(function () {
        window.location.href = 'axima/index.html';
      }, 500);
    }, 3200);
  </script>

</body>
</html>
