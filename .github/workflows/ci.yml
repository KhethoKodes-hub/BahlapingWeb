name: Bahlaping Mash CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # ─────────────────────────────────────────────
  # JOB 1 — Validate HTML
  # ─────────────────────────────────────────────
  validate:
    name: 🔍 Validate HTML
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install html-validate
        run: npm install -g html-validate

      - name: Validate HTML pages
        run: |
          html-validate axima/index.html \
            axima/about-us.html \
            axima/Industries-industry-served.html \
            axima/leadership-team.html \
            axima/contacs.html \
            axima/why-us.html \
            axima/request-quote.html \
            axima/case-studies-grid.html || true
        # `|| true` keeps pipeline green while we iterate — remove when HTML is clean

  # ─────────────────────────────────────────────
  # JOB 2 — Link Check
  # ─────────────────────────────────────────────
  linkcheck:
    name: 🔗 Check Internal Links
    runs-on: ubuntu-latest
    needs: validate
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install lychee link checker
        run: |
          curl -sSfL https://raw.githubusercontent.com/lycheeverse/lychee/master/scripts/install.sh | sh -s -- -b ~/.local/bin
          echo "$HOME/.local/bin" >> $GITHUB_PATH

      - name: Check links in HTML files
        run: |
          lychee --offline \
            --include-fragments \
            axima/*.html || true

  # ─────────────────────────────────────────────
  # JOB 3 — Deploy to GitHub Pages
  # ─────────────────────────────────────────────
  deploy:
    name: 🚀 Deploy to GitHub Pages
    runs-on: ubuntu-latest
    needs: [validate, linkcheck]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    permissions:
      contents: write
      pages: write
      id-token: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Copy axima/ to deploy root
        run: |
          mkdir -p deploy
          cp -r axima/. deploy/

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./deploy
          commit_message: "deploy: ${{ github.sha }}"

  # ─────────────────────────────────────────────
  # JOB 4 — (Optional) FTP Deploy to cPanel Host
  # Uncomment and set secrets in GitHub repo settings:
  #   FTP_SERVER, FTP_USERNAME, FTP_PASSWORD
